name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/slot-machine-hub-pwa-q5oqdb', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Type-check and validate the math before publishing.
      - run: npm run check
      - run: npm test

      - name: Build
        env:
          # Project pages are served from https://<owner>.github.io/<repo>/,
          # so the app must be built with that base path.
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
